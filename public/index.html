<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The server injects <meta name="office-token" content="…"> here; js/api.js sends it back as X-Office-Token on POSTs. -->
  <meta name="color-scheme" content="dark">
  <title>Agent Office</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8'/%3E%3Crect x='1' y='1' width='2' height='6' fill='%23f47c58'/%3E%3Crect x='3' y='1' width='2' height='6' fill='%2338dca8'/%3E%3Crect x='5' y='1' width='2' height='6' fill='%238880ff'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/press-start-2p-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <!-- chrome.css: top bar, roster, tasks, toasts, menus (loaded second, so it can tighten rules in style.css) -->
  <link rel="stylesheet" href="chrome.css">
</head>
<body class="is-loading">
  <!-- The world module owns this canvas. Everything else is the app shell, layered on top. -->
  <canvas id="office" aria-label="The office: a live map of your running agent sessions. Use the roster to reach every agent from the keyboard."></canvas>

  <main id="stage" aria-live="polite"></main>

  <div id="ui">
    <!-- topbar, notices, roster, tasks, transcript and dialogue are mounted here by js/app.js -->
  </div>

  <div id="modals"></div>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <noscript>
    <p class="noscript">Agent Office needs JavaScript to show your agents.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
