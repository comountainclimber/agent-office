<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Office · Tower</title>
<style>
  @font-face { font-family: "PS2P"; src: url("../../fonts/press-start-2p-latin-400.woff2") format("woff2"); font-display: swap; }
  :root {
    --ink: #f4f4f4; --dim: #9aa0b4; --bg: #0b0b12; --hot: #ffd23f; --red: #f04848; --green: #58e868;
    --claude: #e06a48; --codex: #28c898; --cursor: #6c5cf8;
    --px: "PS2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font: 10px/1.5 var(--px); -webkit-font-smoothing: none; }
  canvas#world { position: fixed; left: 0; top: 0; image-rendering: pixelated; touch-action: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .panel { background: #000; border: 3px solid var(--ink); box-shadow: 0 0 0 3px #000, 6px 6px 0 3px rgba(0,0,0,.55); }
  .btn { all: unset; cursor: pointer; padding: 7px 9px 6px; border: 2px solid var(--ink); background: #000; color: var(--ink); font: 10px/1 var(--px); letter-spacing: .04em; white-space: nowrap; }
  .btn:hover { background: var(--ink); color: #000; }
  .btn:focus-visible, .frow:focus-visible, .chip:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
  .btn.hot { border-color: var(--hot); color: var(--hot); }
  .btn.hot:hover { background: var(--hot); color: #000; }
  .btn[disabled] { opacity: .35; cursor: not-allowed; pointer-events: none; }

  /* HUD */
  #hud { position: fixed; left: 10px; top: 10px; display: flex; align-items: stretch; gap: 8px; pointer-events: none; z-index: 2; }
  #hud > * { pointer-events: auto; }
  #hud .plate { display: flex; align-items: center; gap: 12px; padding: 6px 10px; }
  #hud .brand { letter-spacing: .14em; }
  #hud .stat { color: var(--dim); white-space: nowrap; }
  #hud .stat b { font-weight: 400; color: var(--ink); font-size: 12px; }
  #hud .stat.work b { color: var(--green); }
  #need { animation: blink .8s steps(1) infinite; font-size: 10px; }
  #need.none { animation: none; border-color: #44485c; color: #7c8098; pointer-events: none; }
  #new { font-size: 10px; }
  @keyframes blink { 50% { background: var(--hot); color: #000; } }
  #mode { color: var(--dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #mode::before { content: ""; width: 7px; height: 7px; background: var(--hot); }
  #mode.live { color: var(--green); }
  #mode.live::before { background: var(--green); }
  @media (max-width: 1180px) { #hud .brand { display: none; } #hud .plate { gap: 9px; } }

  /* street-level strip: zoom on the left, tool legend on the right */
  .strip { position: fixed; bottom: 5px; display: flex; align-items: center; gap: 10px; padding: 3px 7px; border-width: 2px; box-shadow: 0 0 0 2px #000; white-space: nowrap; }
  #zoom { left: 7px; gap: 4px; padding: 3px; }
  #zoom .btn { padding: 4px 6px 3px; border-width: 2px; font-size: 10px; }
  #zoom #z-lab { min-width: 46px; text-align: center; border-color: transparent; color: var(--dim); }
  #zoom #z-lab:hover { color: #000; }
  #legend { right: 7px; color: var(--dim); }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 10px; height: 10px; display: inline-block; }
  #legend b { font-weight: 400; color: var(--ink); }
  #legend .claude i { background: var(--claude); } #legend .codex i { background: var(--codex); } #legend .cursor i { background: var(--cursor); }
  body.dlg-open .strip { display: none; }
  @media (max-width: 1180px) { #legend .nm { display: none; } }

  /* "more floors" when the tower is taller than the window */
  .more { position: fixed; left: 10px; font-size: 10px; padding: 5px 8px 4px; border-width: 2px; box-shadow: 0 0 0 2px #000; z-index: 1; }
  .more.alert { border-color: var(--hot); color: var(--hot); animation: blink .8s steps(1) infinite; }
  #more-up { top: 58px; }
  #more-down { bottom: 5px; }
  body.dlg-open #more-down { display: none; }

  /* floor index (elevator panel) */
  #index { position: fixed; right: 10px; top: 10px; width: 204px; max-height: calc(100% - 20px - var(--dlg, 0px)); display: flex; flex-direction: column; z-index: 2; }
  #index .cap { padding: 6px 8px; border-bottom: 3px solid var(--ink); display: flex; justify-content: space-between; letter-spacing: .1em; }
  #index .cap span:last-child { color: var(--dim); }
  #floors { list-style: none; margin: 0; padding: 4px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #5a5e78 #000; display: flex; flex-direction: column; gap: 2px; }
  .frow { all: unset; cursor: pointer; display: grid; grid-template-columns: 26px minmax(0, 1fr) 18px; align-items: center; gap: 7px; padding: 4px 3px; width: 100%; box-sizing: border-box; border: 2px solid transparent; }
  .frow:hover { border-color: var(--ink); }
  .frow.sel { border-color: var(--hot); }
  .frow.off .nm, .frow.off .num, .frow.off .cnt { opacity: .5; }
  .frow .num { width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-size: 10px; line-height: 1; padding: 1px 0 0 1px; }
  .frow.vis .num { background: #2a2c40; }
  .frow.car .num { border-color: var(--green); color: var(--green); }
  .frow.alert .num { background: var(--hot); color: #000; border-color: var(--hot); animation: flash .5s steps(1) infinite; }
  @keyframes flash { 50% { background: #000; color: var(--hot); } }
  .frow .nm { font-size: 10px; line-height: 1.3; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-transform: uppercase; }
  .frow.alert .nm { color: var(--hot); }
  .frow .pips { display: flex; gap: 3px; margin-top: 4px; height: 7px; }
  .pip { width: 8px; height: 7px; box-sizing: border-box; }
  .pip.claude { background: var(--claude); } .pip.codex { background: var(--codex); } .pip.cursor { background: var(--cursor); }
  .pip.idle { background: none; border: 2px solid; }
  .pip.idle.claude { border-color: var(--claude); } .pip.idle.codex { border-color: var(--codex); } .pip.idle.cursor { border-color: var(--cursor); }
  .pip.waiting { animation: pipw .4s steps(1) infinite; }
  @keyframes pipw { 50% { background: #fff; } }
  .frow .cnt { font-size: 10px; color: var(--dim); text-align: right; }
  .frow.alert .cnt { color: var(--hot); font-size: 14px; animation: bounce .5s steps(2) infinite; }
  @keyframes bounce { 50% { transform: translateY(-3px); } }
  #index .empty { padding: 10px 8px; color: var(--dim); font-size: 10px; line-height: 1.6; }

  /* narrower than the supported 1100px (e.g. a docked preview pane): the index folds to lift buttons, the HUD drops the extras */
  @media (max-width: 1000px) {
    #index { width: 48px; }
    #index .cap { justify-content: center; padding: 6px 2px; }
    #index .cap span:first-child, #index .empty { display: none; }
    .frow { grid-template-columns: 26px; justify-content: center; padding: 3px 0; }
    .frow > span:nth-child(2), .frow .cnt { display: none; }
    #hud .stat.brk { display: none; }
    #mode { font-size: 0; gap: 0; }
    #dlg { grid-template-columns: 80px minmax(0, 1fr); }
    #dlg .acts { grid-column: 1 / -1; flex-direction: row; min-width: 0; flex-wrap: wrap; }
    #dlg .acts .x { order: 9; margin-left: auto; }
  }

  /* dialogue box */
  #dlg { position: fixed; left: 10px; right: 10px; bottom: 10px; max-width: 1040px; z-index: 3; margin: 0 auto; display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; gap: 12px; padding: 10px; }
  #portrait { width: 80px; height: 80px; image-rendering: pixelated; border: 3px solid var(--ink); display: block; }
  .pcol { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .pcol .badge { text-align: center; }
  .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #d-name { font-size: 14px; letter-spacing: .06em; }
  .badge { padding: 3px 5px 2px; color: #000; font-size: 10px; }
  .badge.claude { background: var(--claude); } .badge.codex { background: var(--codex); } .badge.cursor { background: var(--cursor); color: #fff; }
  .badge.floor { background: var(--ink); }
  .status { padding: 3px 5px 2px; border: 2px solid currentColor; font-size: 10px; }
  .status.working { color: var(--green); } .status.waiting { color: #000; background: var(--hot); border-color: var(--hot); animation: flash .6s steps(1) infinite; }
  .status.idle { color: var(--dim); } .status.done { color: var(--green); } .status.failed { color: var(--red); }
  #d-where { color: var(--dim); font-size: 10px; }
  .line { margin-top: 6px; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #d-act { color: var(--hot); }
  #d-title { color: var(--ink); }
  #d-title::before { content: "TASK "; color: var(--dim); }
  #d-msg { margin-top: 8px; min-height: 30px; max-height: 60px; overflow-y: auto; font-size: 10px; line-height: 1.55; color: #dfe3f4; scrollbar-width: thin; }
  #d-msg::after { content: "_"; animation: flash .7s steps(1) infinite; color: var(--hot); background: none; margin-left: 2px; }
  #d-msg.done::after, #d-msg:empty::after { content: ""; }
  #d-crew { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  #d-crew .lab { color: var(--dim); font-size: 10px; margin-right: 2px; }
  .chip { all: unset; cursor: pointer; padding: 4px 6px 3px; border: 2px solid #5a5e78; font-size: 10px; display: inline-flex; gap: 5px; align-items: center; max-width: 100%; }
  .chip .what { font: 11px/1.2 ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }
  .chip:hover { border-color: var(--ink); background: #1a1c2c; }
  .chip .st { font-size: 10px; }
  .chip.working .st { color: var(--green); } .chip.done .st { color: var(--green); } .chip.failed .st { color: var(--red); } .chip.waiting .st { color: var(--hot); } .chip.idle .st { color: var(--dim); }
  .chip.waiting { border-color: var(--hot); }
  .acts { display: flex; flex-direction: column; gap: 7px; align-items: stretch; min-width: 124px; }
  .acts .btn { text-align: center; }
  .acts .x { align-self: flex-end; padding: 5px 7px 4px; }
  #d-send { margin-top: 8px; display: flex; gap: 6px; }
  #d-send input { flex: 1; min-width: 0; background: #10111c; border: 2px solid var(--ink); padding: 6px; font: 12px/1.2 ui-monospace, "SF Mono", Menlo, monospace; outline: none; }
  #d-send input:focus { border-color: var(--hot); }
  #d-note { color: var(--green); font-size: 10px; margin-top: 6px; min-height: 10px; }

  /* modals */
  #scrim { position: fixed; inset: 0; background: rgba(4, 4, 12, .62); display: grid; place-items: center; z-index: 5; }
  .modal { width: min(640px, calc(100% - 40px)); max-height: calc(100% - 30px); display: flex; flex-direction: column; }
  .modal .cap { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 3px solid var(--ink); letter-spacing: .1em; }
  .modal .body { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 12px; border-top: 3px solid var(--ink); align-items: center; }
  .field > label, .field > .lab { display: block; color: var(--dim); font-size: 10px; margin-bottom: 7px; letter-spacing: .08em; }
  .field > label b, .field > .lab b { color: var(--hot); font-weight: 400; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg label { cursor: pointer; }
  .seg input, .cards input, .pick input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 8px 10px 7px; border: 2px solid #5a5e78; font-size: 10px; }
  .seg input:checked + span { border-color: var(--ink); background: var(--ink); color: #000; }
  .seg input:focus-visible + span, .cards input:focus-visible + .in, .pick input:focus-visible + .in { outline: 2px solid var(--hot); outline-offset: 2px; }
  .seg .danger input:checked + span { background: var(--red); border-color: var(--red); }
  /* tool cards */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .cards label { cursor: pointer; }
  .cards .in { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; row-gap: 5px; align-items: center; padding: 8px; border: 2px solid #5a5e78; }
  .cards .bd { grid-row: 1 / 3; width: 34px; height: 34px; display: grid; place-items: center; color: #000; font-size: 12px; font-weight: 400; padding: 1px 0 0 1px; }
  .cards .claude .bd { background: var(--claude); } .cards .codex .bd { background: var(--codex); } .cards .cursor .bd { background: var(--cursor); color: #fff; }
  .cards .tn { font-size: 11px; }
  .cards .tv { font: 11px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim); font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cards input:checked + .in { border-color: var(--ink); background: #1c1e30; box-shadow: inset 0 0 0 2px var(--ink); }
  .cards input:disabled + .in { opacity: .35; cursor: not-allowed; }
  .cards .warn .tv { color: var(--red); }
  /* which floor? */
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-height: 190px; overflow-y: auto; padding: 2px; scrollbar-width: thin; scrollbar-color: #5a5e78 #000; }
  .pick label { cursor: pointer; min-width: 0; }
  .pick .in { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 8px; align-items: center; padding: 6px 7px; border: 2px solid #5a5e78; min-height: 46px; }
  .pick .fnum { width: 30px; height: 30px; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-size: 10px; padding: 1px 0 0 1px; }
  .pick .vacant .fnum { border-style: dashed; border-color: var(--dim); color: var(--dim); }
  .pick .fname { font-size: 10px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick .fpath { font: 11px/1.2 ui-monospace, "SF Mono", Menlo, monospace; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; margin-top: 4px; }
  .pick .fhere { font-size: 10px; color: var(--dim); display: flex; gap: 2px; }
  .pick input:checked + .in { border-color: var(--hot); background: #1c1e30; box-shadow: inset 0 0 0 2px var(--hot); }
  .pick input:checked + .in .fnum { background: var(--hot); border-color: var(--hot); border-style: solid; color: #000; }
  .pick .in:hover { border-color: var(--ink); }
  .pick .new .in { border-style: dashed; }
  .pick.one { grid-template-columns: 1fr; margin-top: 4px; overflow: visible; }
  .pick.one .in { min-height: 40px; }
  .pick:empty { display: none; }
  select, textarea, input[type="text"] { width: 100%; background: #10111c; border: 2px solid var(--ink); padding: 7px; font: 12px/1.35 ui-monospace, "SF Mono", Menlo, monospace; outline: none; border-radius: 0; }
  select:focus, textarea:focus, input[type="text"]:focus { border-color: var(--hot); }
  textarea { resize: vertical; min-height: 64px; }
  #nt-path { margin-top: 6px; }
  #nt-floor { color: var(--hot); font-size: 10px; margin-top: 7px; min-height: 12px; }
  #nt-warn { color: var(--red); font-size: 10px; margin-top: 7px; line-height: 1.6; }
  #nt-err { color: var(--red); font-size: 10px; margin-right: auto; }
  #tr-list { display: flex; flex-direction: column; gap: 8px; }
  .msg { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: start; }
  .msg .who { font-size: 10px; padding-top: 3px; color: var(--dim); }
  .msg.user .who { color: var(--hot); } .msg.assistant .who { color: var(--green); }
  .msg .txt { font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .msg.tool .txt { color: var(--dim); }
  .msg.user .txt { color: #fff; }
  #transcript { width: min(720px, calc(100% - 40px)); height: min(520px, calc(100% - 30px)); }
</style>
</head>
<body>
<canvas id="world" aria-label="Cutaway office tower. One floor per project."></canvas>

<header id="hud">
  <div class="panel plate">
    <span class="brand">TOWER</span>
    <span class="stat"><b id="s-all">0</b> AGENTS</span>
    <span class="stat work"><b id="s-work">0</b> WORKING</span>
    <span class="stat brk"><b id="s-idle">0</b> ON BREAK</span>
    <span id="mode">…</span>
  </div>
  <button class="btn hot panel none" id="need" type="button" title="Jump to the next agent waiting for you (Tab)">NOBODY NEEDS YOU</button>
  <button class="btn panel" id="new" type="button" title="Start a new task (N)">+ NEW TASK</button>
</header>

<button class="btn panel more" id="more-up" type="button" hidden></button>
<button class="btn panel more" id="more-down" type="button" hidden></button>

<nav id="index" class="panel" aria-label="Floors">
  <div class="cap"><span>FLOORS</span><span id="f-count"></span></div>
  <ol id="floors"></ol>
</nav>

<div id="zoom" class="panel strip"><button class="btn" id="z-out" type="button" aria-label="Zoom out" title="Zoom out (-)">-</button><button class="btn" id="z-lab" type="button" title="Fit the whole tower (0)">FIT</button><button class="btn" id="z-in" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button></div>
<div id="legend" class="panel strip" aria-label="Shirt colour shows the tool">
  <span class="claude" title="Claude Code agents wear orange"><i></i><span class="nm">CLAUDE</span><b id="l-claude">0</b></span>
  <span class="codex" title="Codex agents wear green"><i></i><span class="nm">CODEX</span><b id="l-codex">0</b></span>
  <span class="cursor" title="Cursor agents wear purple"><i></i><span class="nm">CURSOR</span><b id="l-cursor">0</b></span>
</div>

<section id="dlg" class="panel" hidden aria-live="polite">
  <div class="pcol">
    <canvas id="portrait" width="80" height="80"></canvas>
    <span class="badge" id="d-badge"></span>
  </div>
  <div class="main">
    <div class="head"><span id="d-name"></span><span class="status" id="d-status"></span><span id="d-where"></span></div>
    <div class="line" id="d-act"></div>
    <div class="line" id="d-title"></div>
    <div id="d-msg"></div>
    <div id="d-crew"></div>
    <form id="d-send" hidden><input id="d-input" type="text" placeholder="Message this agent…" autocomplete="off"><button class="btn hot" type="submit">SEND</button></form>
    <div id="d-note"></div>
  </div>
  <div class="acts">
    <button class="btn x" id="d-close" type="button" aria-label="Close">X</button>
    <button class="btn" id="d-tr" type="button">TRANSCRIPT</button>
    <button class="btn" id="d-msgbtn" type="button">SEND MESSAGE</button>
    <button class="btn" id="d-here" type="button" hidden>+ TASK HERE</button>
  </div>
</section>

<div id="scrim" hidden>
  <section id="transcript" class="panel modal" hidden role="dialog" aria-label="Transcript">
    <div class="cap"><span id="tr-title">TRANSCRIPT</span><button class="btn" id="tr-close" type="button">X</button></div>
    <div class="body"><div id="tr-list"></div></div>
  </section>
  <form id="newtask" class="panel modal" hidden role="dialog" aria-label="New task">
    <div class="cap"><span>RECEPTION · NEW TASK</span><button class="btn" id="nt-close" type="button">X</button></div>
    <div class="body">
      <div class="field"><span class="lab"><b>1</b> WHO TAKES IT?</span>
        <div class="cards" id="nt-tools" role="radiogroup" aria-label="Tool">
          <label class="claude"><input type="radio" name="tool" value="claude" checked><span class="in"><b class="bd">CL</b><span class="tn">CLAUDE</span><i class="tv" id="tv-claude"></i></span></label>
          <label class="codex"><input type="radio" name="tool" value="codex"><span class="in"><b class="bd">CX</b><span class="tn">CODEX</span><i class="tv" id="tv-codex"></i></span></label>
          <label class="cursor"><input type="radio" name="tool" value="cursor"><span class="in"><b class="bd">CU</b><span class="tn">CURSOR</span><i class="tv" id="tv-cursor"></i></span></label>
        </div>
      </div>
      <div class="field"><span class="lab"><b>2</b> WHICH FLOOR?</span>
        <div class="pick" id="nt-floors" role="radiogroup" aria-label="Project folder"></div>
        <div class="pick one">
          <label class="new vacant" title="Start in a folder that has no floor yet"><input type="radio" name="dir" value="__new"><span class="in"><span class="fnum">+</span><span><div class="fname">NEW FLOOR…</div><div class="fpath" id="nt-newhint">type the folder path</div></span><span class="fhere"></span></span></label>
        </div>
        <input id="nt-path" type="text" placeholder="/absolute/path/to/project" aria-label="Folder for the new floor" hidden>
        <div id="nt-floor"></div>
      </div>
      <div class="field"><span class="lab"><b>3</b> HOW MUCH FREEDOM?</span>
        <div class="seg">
          <label><input type="radio" name="perm" value="read"><span>READ ONLY</span></label>
          <label><input type="radio" name="perm" value="edit" checked><span>EDIT FILES</span></label>
          <label class="danger"><input type="radio" name="perm" value="full"><span>FULL AUTO</span></label>
        </div>
        <div id="nt-warn" hidden>! FULL AUTO runs any command without asking. Only use it in a folder you trust.</div>
      </div>
      <div class="field"><label for="nt-prompt"><b>4</b> THE TASK</label>
        <textarea id="nt-prompt" placeholder="What should the new hire do?"></textarea>
      </div>
    </div>
